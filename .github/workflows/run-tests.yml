name: Run Tests

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

concurrency:
  group: run-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npm test
        env:
          STONEWAKE_APP_URL: ${{ secrets.STONEWAKE_APP_URL }}
          STONEWAKE_API_URL: ${{ secrets.STONEWAKE_API_URL }}
          STONEWAKE_EMAIL: ${{ secrets.STONEWAKE_EMAIL }}
          STONEWAKE_PASSWORD: ${{ secrets.STONEWAKE_PASSWORD }}
          STONEWAKE_API_KEY: ${{ secrets.STONEWAKE_API_KEY }}
      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: artifacts/playwright-report/
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload report for GitHub Pages
        if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/playwright-report/
      - name: Upload test results (traces, screenshots)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results/
          retention-days: 14
          if-no-files-found: ignore

  deploy-report:
    needs: test
    if: ${{ !cancelled() && needs.test.result != 'skipped' && github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
